<H1>Add Inventory</H1>
<div *ngIf="checkValidity()" class="alert alert-danger">{{errorMessage}}</div>
<!-- <H2>Item Code - </H2><H2 [(ngModel)] ="inventory.itemCode"></H2> -->
<div class="container">
    <fieldset class="form-group">
        <label>New Items to be added</label>
        <input type="number" [(ngModel)]="inventory.inventoryCredited" class="form-control" name="inventoryCredited"
            required="required">
    </fieldset>
    <fieldset class="form-group">
        <label>Supplier</label>
        <br>
        <div class="dropdown-search" [ngClass]="{'open':shown,'small':size=='small'}">
            <span class="dropdown-search-btn" (click)="show($event)">{{selected}}</span>
            <div class="dropdown-search-dropdown">
                <input type="text" placeholder="Search" [(ngModel)]="val" #searchfield (keyup)="search(val)" />
                <div class="dropdown-search-scroller">
                    <div class="dropdown-search-item" *ngFor="let item of list" (click)="select($event,item)">
                        {{item.supplierDescription}}</div>
                    <div class="dropdown-search-404" *ngIf="list.length == 0">No Result Found</div>
                </div>
            </div>
        </div>
    </fieldset>
    <fieldset class="form-group">
        <label>Comments</label>
        <input type="text" [(ngModel)]="inventory.comments" class="form-control" name="comments" required="required">
    </fieldset>
    <button class="btn btn-success" (click)="addInventory()">Save</button>
</div>
